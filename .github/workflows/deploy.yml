name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pinned version and the wasm32 target from rust-toolchain.toml.
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false

      # Must equal the `wasm-bindgen = "=X"` pin in Cargo.toml: a CLI whose
      # version differs from the crate's refuses the module.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128

      - name: Install Binaryen (wasm-opt)
        run: |
          wget https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz
          tar -xzf binaryen-version_119-x86_64-linux.tar.gz
          echo "$(pwd)/binaryen-version_119/bin" >> $GITHUB_PATH

      # The size-tuned profile (Cargo.toml) and the app's binary only.
      - name: Build WASM
        run: cargo build --profile wasm-release --target wasm32-unknown-unknown --bin symbios-robot-lab

      - name: Generate JS Bindings
        run: |
          wasm-bindgen --out-dir ./dist --target web \
            --out-name symbios-robot-lab \
            --no-typescript \
            target/wasm32-unknown-unknown/wasm-release/symbios-robot-lab.wasm

      - name: Optimize WASM
        run: wasm-opt -Oz -o ./dist/symbios-robot-lab_bg.wasm ./dist/symbios-robot-lab_bg.wasm

      - name: Assemble Site
        run: |
          cp index.html ./dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
