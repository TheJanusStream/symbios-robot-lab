name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pinned version and the wasm32 target from rust-toolchain.toml.
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false

      # Must equal the `wasm-bindgen = "=X"` pin in Cargo.toml: a CLI whose
      # version differs from the crate's refuses the module.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128

      # The size-tuned profile (Cargo.toml) and the app's binary only.
      - name: Build WASM
        run: cargo build --profile wasm-release --target wasm32-unknown-unknown --bin symbios-robot-lab

      - name: Generate JS Bindings
        run: |
          wasm-bindgen --out-dir ./dist --target web \
            --out-name symbios-robot-lab \
            --no-typescript \
            target/wasm32-unknown-unknown/wasm-release/symbios-robot-lab.wasm

      # No wasm-opt step. Rust 1.98 emits bulk-memory, saturating float-to-int
      # and other post-MVP instructions, which Binaryen refuses unless told
      # each feature; told them, every level makes the download bigger,
      # because the restructured code compresses worse (measured 2026-11-20,
      # Binaryen 116, against the module above):
      #
      #              raw       gzip -9   brotli -11
      #   as built   35.06 MB  8.46 MB   5.35 MB
      #   -Oz        27.89 MB  8.99 MB   5.72 MB
      #   -Os        31.70 MB  9.10 MB   5.73 MB
      #   -O2        32.12 MB  9.19 MB   5.76 MB
      #
      # Pages serves the module compressed, so it ships as built. Overlands
      # dropped its wasm-opt step for the same measured reason.

      - name: Assemble Site
        run: |
          cp index.html ./dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
